[project]
name = "medicure-ai"
version = "2.0.0"
description = "Grounded medicine safety and affordability engine — DIP restores, retrieval identifies, the LLM only explains."
requires-python = ">=3.11"

dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",

    # --- Digital image processing ---
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "scipy>=1.14.0",
    "Pillow>=10.4.0",
    "pytesseract>=0.3.13",

    # --- ML / resolver ---
    # Upper bound is load-bearing, not caution. data/artifacts/calibrator.joblib
    # is a pickled GradientBoostingClassifier, and scikit-learn relocates
    # private modules between MINOR versions. With an open bound the container
    # resolved 1.9.0 against an artifact fitted by 1.7.2 and failed with
    # "ModuleNotFoundError: No module named '_loss'" -- which surfaced not as a
    # crash but as calibrated=false in production, because the loader falls
    # back rather than blocking startup.
    #
    # Raise this ceiling only together with re-running scripts/fit_calibrator.py
    # and rebuilding the image; the Dockerfile asserts the artifact loads, so a
    # mismatch fails the build rather than shipping.
    "scikit-learn>=1.7,<1.8",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    "rapidfuzz>=3.9.0",
    "jellyfish>=1.1.0",

    # --- AWS / Bedrock ---
    "boto3>=1.35.0",
    # botocore[crt] is required by the `aws login` credential provider; without
    # it, client construction fails with MissingDependencyException.
    "botocore[crt]>=1.35.0",

    # --- Storage ---
    "motor>=3.6.0",
    "pymongo>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
